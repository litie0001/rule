# 规则匹配
rules:
  - GEOSITE,private,直连
  - GEOIP,private,直连,no-resolve
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOSITE,CN))),(NOT,((GEOIP,CN)))),REJECT
  - RULE-SET,proxylite,🚀 默认代理
  - GEOSITE,category-ai-!cn,🤖 AI
  - GEOSITE,apple@cn,直连
  - GEOSITE,apple,🍎 Apple
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,google,🍀 Google
  - GEOSITE,github,👨🏿‍💻 GitHub
  - GEOSITE,onedrive,🐬 OneDrive
  - GEOSITE,microsoft@cn,直连
  - GEOSITE,microsoft,🪟 Microsoft
  - GEOSITE,tiktok,🎵 TikTok
  - GEOSITE,ookla-speedtest,✈️ Speedtest
  - GEOSITE,telegram,📲 Telegram
  - GEOSITE,netflix,🎥 NETFLIX
  - GEOSITE,paypal,💶 PayPal
  - GEOSITE,gfw,🚀 默认代理
  - RULE-SET,apple_ip,🍎 Apple
  - GEOIP,google,🍀 Google
  - GEOIP,netflix,🎥 NETFLIX
  - GEOIP,telegram,📲 Telegram
  - GEOSITE,geolocation-!cn,🚀 默认代理
  - GEOSITE,CN,直连
  - GEOIP,CN,直连
  - MATCH,🐟 漏网之鱼

# 规则集：只保留 Geo 数据库未覆盖或有特殊用途的规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  proxylite: { <<: *class, url: "https://testingcf.jsdelivr.net/gh/litie0001/rule@master/rules/proxy.list" }
  # geoip.dat 不含 Apple 专用 IP 分类，继续使用原 MRS
  apple_ip: { <<: *ip, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo-lite/geoip/apple.mrs" }
  # TUN route-exclude-address-set 需要 CIDR 规则集，继续保留 cn_ip
  cn_ip: { <<: *ip, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs" }
